<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Semantic HTML Page</title>
</head>
<body>

    <header>
        <h1>My Website</h1>

        <nav>
            <a href="#">Home</a> |
            <a href="#">About</a> |
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Section 1</h2>

            <article>
                <h3>Article 1</h3>
                <p>This is the first article inside section 1.</p>
            </article>
        </section>

        <section>
            <h2>Section 2</h2>

            <article>
                <h3>Article 2</h3>
                <p>This is the second article inside section 2.</p>
            </article>
        </section>

        <aside>
            <h3>Sidebar</h3>
            <p>Related links and information.</p>
        </aside>

    </main>

    <footer>
        <p>&copy; 2026 My Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
